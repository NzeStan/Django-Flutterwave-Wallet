[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-flutterwave-wallet"
version = "1.0.0"
description = "A pluggable, production-grade Django wallet backed by Flutterwave: multi-currency wallets, a hash-chained ledger, checkout, direct charges, saved cards, virtual accounts, payouts, transfers, escrow, bills, refunds, KYC, fees and the complete Flutterwave v3 API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ifeanyi Stanley Nnamani", email = "nnamaniifeanyi10@gmail.com" }]
requires-python = ">=3.10"
keywords = ["django", "flutterwave", "wallet", "payments", "fintech", "ledger", "africa", "nigeria", "marketplace"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "django-money>=3.4",
    "requests>=2.31",
    "cryptography>=42",
]

[project.optional-dependencies]
celery = ["celery>=5.3"]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
    "responses>=0.25",
    "celery>=5.3",
]

[project.urls]
Homepage = "https://github.com/NzeStan/Django-Flutterwave-Wallet"
Documentation = "https://github.com/NzeStan/Django-Flutterwave-Wallet/tree/main/docs"
Changelog = "https://github.com/NzeStan/Django-Flutterwave-Wallet/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/NzeStan/Django-Flutterwave-Wallet/issues"

[tool.setuptools.packages.find]
include = ["flutterwave_wallet*"]

[tool.setuptools.package-data]
flutterwave_wallet = ["templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]

[tool.coverage.run]
source = ["flutterwave_wallet"]
omit = ["flutterwave_wallet/migrations/*"]
