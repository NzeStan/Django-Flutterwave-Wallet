# Publishes to PyPI when a GitHub Release is published.
#
# One-time setup (see RELEASING.md):
#   * PyPI  -> Your account -> Publishing -> add a (pending) trusted publisher:
#              project django-flutterwave-wallet, owner NzeStan, repository Django-Flutterwave-Wallet,
#              workflow publish.yml, environment pypi
#   * GitHub -> Settings -> Environments -> New environment "pypi"
# No API token or password is stored anywhere: PyPI trusts this workflow directly.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build package
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CODE_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('flutterwave_wallet/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$VERSION flutterwave_wallet.__version__=$CODE_VERSION"
          if [ "${TAG#v}" != "$VERSION" ] || [ "$VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Release tag ($TAG), pyproject.toml ($VERSION) and flutterwave_wallet/__init__.py ($CODE_VERSION) must all match (tag may start with 'v')."
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-flutterwave-wallet/
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    name: Attach files to the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
